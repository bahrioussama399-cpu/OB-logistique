<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>OB Logistique - منصة النقل الذكية</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --accent: #ffb703;
            --card-bg: #1a1a1a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
        }

        header h1 {
            margin: 0;
            color: var(--accent);
            font-size: 24px;
        }

        .container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        #qrcode {
            background: white;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 15px;
        }

        .nav-modern {
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #333;
            margin-top: auto;
        }

        .nav-item-modern {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #888;
            cursor: pointer;
            transition: 0.3s;
            padding: 10px;
            border-radius: 10px;
        }

        .nav-item-modern:hover {
            color: var(--accent);
        }

        .nav-item-modern i {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .nav-label {
            font-size: 12px;
        }

        #installAppBtn {
            display: none; /* Masqué par défaut, s'affiche si le téléphone le permet */
            background: rgba(255, 183, 3, 0.1);
            color: var(--accent);
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: black;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <header>
        <h1>OB Logistique</h1>
    </header>

    <div class="container">
        <div class="card">
            <h2>مرحباً بك (Bienvenue)</h2>
            <p>منصة النقل الذكية الخاصة بك</p>
            <div id="qrcode"></div>
        </div>
    </div>

    <div class="nav-modern">
        <div class="nav-item-modern" onclick="alert('Accueil')">
            <i class="fas fa-home"></i>
            <span class="nav-label">الرئيسية</span>
        </div>
        
        <div class="nav-item-modern" id="installAppBtn">
            <i class="fas fa-download"></i>
            <span class="nav-label">تثبيت التطبيق</span>
        </div>
        
        <div class="nav-item-modern" onclick="alert('Déconnexion')">
            <i class="fas fa-sign-out-alt"></i>
            <span class="nav-label">خروج</span>
        </div>
    </div>

    <div id="toast" class="toast">تم تثبيت التطبيق بنجاح</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        // Génération du QR Code
        const qrDiv = document.getElementById('qrcode');
        if (qrDiv) {
            new QRCode(qrDiv, { 
                text: "OB Logistique", 
                width: 150, 
                height: 150, 
                colorDark : "#0a0a0a", 
                colorLight : "#ffffff" 
            });
        }

        // ==================== PWA IMPLEMENTATION (APP INSTALL) ====================
        const setupPWA = () => {
            // 1. Génération du Manifest dynamiquement
            const manifest = {
                name: "OB Logistique",
                short_name: "OB Log",
                description: "منصة النقل الذكية",
                start_url: ".",
                display: "standalone",
                background_color: "#0a0a0a",
                theme_color: "#ffb703",
                icons: [{
                    src: "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'%3E%3Cpath fill='%23ffb703' d='M48 0C21.5 0 0 21.5 0 48V368c0 26.5 21.5 48 48 48H64c0 53 43 96 96 96s96-43 96-96H384c0 53 43 96 96 96s96-43 96-96h32c17.7 0 32-14.3 32-32s-14.3-32-32-32V288 256 237.3c0-17-6.7-33.3-18.7-45.3L512 114.7c-12-12-28.3-18.7-45.3-18.7H416V48c0-26.5-21.5-48-48-48H48zM416 160h50.7L544 237.3V256H416V160zM112 416a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm336-32a32 32 0 1 1 0 64 32 32 0 1 1 0-64z'/%3E%3C/svg%3E",
                    sizes: "512x512",
                    type: "image/svg+xml"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(manifestBlob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestURL;
            document.head.appendChild(link);

            // 2. Génération du Service Worker
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => self.clients.claim());
                    self.addEventListener('fetch', (e) => {});
                `;
                const swBlob = new Blob([swCode], {type: 'application/javascript'});
                const swURL = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swURL).catch(err => console.log('SW setup skipped'));
            }
        };

        setupPWA();

        // Gestion du bouton d'installation
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');
        const toast = document.getElementById('toast');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installBtn) installBtn.style.display = 'flex'; // Affiche le bouton
        });

        installBtn?.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                    toast.style.display = 'block';
                    setTimeout(() => toast.style.display = 'none', 3000);
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
