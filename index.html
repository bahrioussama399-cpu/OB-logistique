<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Na9el Pro - منصة نقل البضائع في تونس</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ar.js"></script>
    <!-- Firebase SDK (الإصدار الأحدث) -->
    <script type="module">
        // استيراد Firebase - تأكد من تثبيت هذه الحزمة عبر npm أو استخدام CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, query, where, orderBy, Timestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

        // 🔥 إعدادات Firebase الخاصة بك - استبدلها بإعدادات مشروعك
        const firebaseConfig = {
  apiKey: "AIzaSyDSZI1Bvsq-KxJJZjmuj5kjyE1xicBbNUI",
  authDomain: "ob-logistique.firebaseapp.com",
  databaseURL: "https://ob-logistique-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ob-logistique",
  storageBucket: "ob-logistique.firebasestorage.app",
  messagingSenderId: "1019224276320",
  appId: "1:1019224276320:web:770fd80601476cc6337205",
  measurementId: "G-JHE00269BM"
};

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // جعل الكائنات متاحة عالمياً
        window.db = db;
        window.auth = auth;
        window.collection = collection;
        window.addDoc = addDoc;
        window.onSnapshot = onSnapshot;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.query = query;
        window.where = where;
        window.orderBy = orderBy;
        window.Timestamp = Timestamp;
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0f172a;
            --primary-light: #1e3a5f;
            --accent: #fbbf24;
            --accent-dark: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --gray-bg: #f8fafc;
            --card-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            color: #1e293b;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        .loading-skeleton {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 1000px 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 20px;
            height: 100px;
            margin-bottom: 15px;
        }

        /* header */
        .header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            color: white;
            padding: 25px 35px;
            border-radius: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 35px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
        }
        .logo span {
            color: var(--accent);
            text-shadow: 0 0 10px rgba(251,191,36,0.3);
        }
        .tagline {
            font-size: 14px;
            opacity: 0.85;
            margin-top: 5px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.15);
            padding: 8px 20px;
            border-radius: 60px;
            backdrop-filter: blur(5px);
        }
        .user-id {
            font-size: 13px;
            font-family: monospace;
        }
        .refresh-btn {
            background: var(--accent);
            color: var(--primary-dark);
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .refresh-btn:hover {
            background: white;
            transform: scale(1.02);
        }

        .tab-buttons {
            display: flex;
            gap: 15px;
        }
        .tab-btn {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 28px;
            border-radius: 60px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Tajawal', sans-serif;
        }
        .tab-btn i {
            margin-left: 8px;
        }
        .tab-btn.active {
            background: var(--accent);
            color: var(--primary-dark);
            border-color: var(--accent);
            box-shadow: 0 8px 20px rgba(251,191,36,0.3);
            transform: translateY(-2px);
        }
        .tab-btn:hover:not(.active) {
            background: rgba(255,255,255,0.25);
        }

        /* cards */
        .card {
            background: rgba(255,255,255,0.98);
            border-radius: 32px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
            animation: fadeInUp 0.5s ease-out;
            border: 1px solid rgba(255,255,255,0.5);
        }

        h2 {
            font-size: 26px;
            margin-bottom: 25px;
            border-right: 5px solid var(--accent);
            padding-right: 18px;
            color: var(--primary-dark);
            font-weight: 800;
        }
        h2 i {
            color: var(--accent);
            margin-left: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #334155;
        }
        label i {
            margin-left: 6px;
            color: var(--accent);
        }
        input, select, textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 24px;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            transition: all 0.25s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(251,191,36,0.2);
        }
        button {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Tajawal', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        button:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(251,191,36,0.3);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 600px;
            overflow-y: auto;
            padding: 5px;
        }
        .order-item {
            background: linear-gradient(135deg, #fffef7, #ffffff);
            border-radius: 28px;
            padding: 22px;
            border-right: 8px solid var(--accent);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .order-item:hover {
            transform: translateX(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        .order-details p {
            margin: 8px 0;
        }
        .badge {
            background: #f1f5f9;
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 800;
            display: inline-block;
        }
        .price-tag {
            background: #fef3c7;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }
        .empty-msg {
            text-align: center;
            padding: 50px;
            background: #f8fafc;
            border-radius: 28px;
            color: #64748b;
        }
        .stats {
            display: flex;
            gap: 25px;
            justify-content: flex-start;
            background: linear-gradient(135deg, #eef2ff, #e0e7ff);
            border-radius: 24px;
            padding: 18px 25px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .filter-bar input, .filter-bar select {
            max-width: 250px;
        }
        .status-badge {
            background: #10b981;
            color: white;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
        }
        .loading-spinner {
            text-align: center;
            padding: 40px;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #475569;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: var(--primary-dark);
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            z-index: 1000;
            animation: fadeInUp 0.3s ease;
        }
        @media (max-width: 700px) {
            .header { flex-direction: column; text-align: center; }
            .order-item { flex-direction: column; align-items: flex-start; }
            .filter-bar { flex-direction: column; }
            .filter-bar input, .filter-bar select { max-width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            <h1>Na9el <span>نقـل</span> <span style="font-size: 14px;">PRO</span></h1>
            <div class="tagline">🚚 منصة النقل اللوجستي الذكية في تونس — متزامنة مع Firebase</div>
        </div>
        <div class="user-info">
            <i class="fas fa-user-circle"></i>
            <span class="user-id" id="userIdDisplay">جاري الاتصال...</span>
            <button class="refresh-btn" id="forceRefreshBtn"><i class="fas fa-sync-alt"></i></button>
        </div>
        <div class="tab-buttons">
            <button class="tab-btn active" id="tabMerchantBtn"><i class="fas fa-store"></i> تاجر</button>
            <button class="tab-btn" id="tabTransporterBtn"><i class="fas fa-truck-moving"></i> ناقل</button>
        </div>
    </div>

    <div id="merchantPanel" class="card">
        <h2><i class="fas fa-plus-circle"></i> نشر طلب نقل بضاعة</h2>
        <form id="orderForm">
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-map-marked-alt"></i> المدينة (من/إلى)</label>
                    <input type="text" id="city" placeholder="مثال: صفاقس → تونس" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-weight-hanging"></i> الوزن (كغ)</label>
                    <input type="number" id="weight" placeholder="مثال: 1200" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-boxes"></i> نوع البضاعة</label>
                    <select id="goodsType">
                        <option>مواد غذائية</option>
                        <option>مواد بناء</option>
                        <option>إلكترونيات</option>
                        <option>ملابس</option>
                        <option>أدوية</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-calendar-clock"></i> وقت النقل</label>
                    <input type="text" id="timeSlot" placeholder="اختر التاريخ والوقت" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-phone-alt"></i> رقم الهاتف</label>
                    <input type="tel" id="merchantPhone" placeholder="مثال: 50123456" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-sticky-note"></i> ملاحظات</label>
                    <input type="text" id="notes" placeholder="تعليمات خاصة...">
                </div>
            </div>
            <button type="submit" id="publishBtn"><i class="fas fa-paper-plane"></i> نشر الطلب</button>
        </form>
        <div class="stats">
            <span><i class="fas fa-truck"></i> طلبات نشطة: <strong id="activeOrdersCount">0</strong></span>
            <span><i class="fas fa-percent"></i> عمولة: 8%</span>
            <span><i class="fas fa-database"></i> قاعدة بيانات فورية</span>
        </div>
    </div>

    <div id="transporterPanel" class="card" style="display: none;">
        <h2><i class="fas fa-list"></i> الطلبات المتاحة</h2>
        <div class="filter-bar">
            <input type="text" id="filterCity" placeholder="🔍 فلتر حسب المدينة...">
            <select id="filterGoods">
                <option value="">كل الأنواع</option>
                <option>مواد غذائية</option>
                <option>مواد بناء</option>
                <option>إلكترونيات</option>
                <option>ملابس</option>
                <option>أدوية</option>
            </select>
        </div>
        <div id="ordersList" class="order-list">
            <div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> جاري تحميل الطلبات...</div>
        </div>
    </div>

    <footer>
        <i class="fas fa-shield-alt"></i> Na9el Pro – نسخة متطورة مع Firebase | مزامنة لحظية
    </footer>
</div>

<script type="module">
    // استيراد Firebase (تم تعريفه في script module أعلاه)
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, where, orderBy, Timestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const db = window.db;
    const auth = window.auth;

    let currentUser = null;
    let unsubscribeOrders = null;
    let allOrders = [];

    // حساب السعر التقديري
    function calculatePrice(weight) {
        return Math.floor(45 + (parseFloat(weight) || 0) * 0.11);
    }

    function showToast(message, isError = false) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = isError ? '#ef4444' : '#0f172a';
        toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    // تحديث إحصائيات الطلبات النشطة
    function updateStats(orders) {
        const active = orders.filter(o => o.status === 'available').length;
        const span = document.getElementById('activeOrdersCount');
        if (span) span.innerText = active;
    }

    // عرض الطلبات للناقل
    function renderOrders(orders) {
        const container = document.getElementById('ordersList');
        if (!container) return;

        const filterCity = document.getElementById('filterCity')?.value.trim().toLowerCase() || '';
        const filterGoods = document.getElementById('filterGoods')?.value || '';

        let filtered = orders.filter(o => o.status === 'available');
        if (filterCity) filtered = filtered.filter(o => o.city.toLowerCase().includes(filterCity));
        if (filterGoods) filtered = filtered.filter(o => o.goodsType === filterGoods);

        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty-msg">🚛 لا توجد طلبات تطابق الفلتر</div>';
            updateStats(orders);
            return;
        }

        container.innerHTML = '';
        filtered.forEach(order => {
            const price = calculatePrice(order.weight);
            let formattedDate = '';
            if (order.timeSlot) {
                const d = new Date(order.timeSlot);
                if (!isNaN(d.getTime())) formattedDate = d.toLocaleString('ar-TN');
            }
            const div = document.createElement('div');
            div.className = 'order-item';
            div.innerHTML = `
                <div class="order-details" style="flex:2">
                    <p><strong><i class="fas fa-map-marker-alt"></i> ${escapeHtml(order.city)}</strong></p>
                    <p>⚖️ ${order.weight} كغ | 📦 ${order.goodsType} | 🕒 ${formattedDate || 'غير محدد'}</p>
                    <div class="price-tag"><i class="fas fa-dinar-sign"></i> السعر: ${price} دينار</div>
                    ${order.notes ? `<p><i class="fas fa-note-sticky"></i> ${escapeHtml(order.notes)}</p>` : ''}
                    <p><span class="badge"><i class="fas fa-tag"></i> مرجع: ${order.id}</span></p>
                </div>
                <div>
                    <button class="accept-order-btn" data-id="${order.id}" data-phone="${order.merchantPhone}" data-city="${escapeHtml(order.city)}" data-weight="${order.weight}" data-type="${order.goodsType}" data-time="${order.timeSlot || ''}" data-notes="${escapeHtml(order.notes || '')}">
                        <i class="fab fa-whatsapp"></i> قبول والتواصل
                    </button>
                </div>
            `;
            container.appendChild(div);
        });

        // إضافة مستمعين لأزرار القبول
        document.querySelectorAll('.accept-order-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const orderId = btn.getAttribute('data-id');
