<script type="module">
    // ==================== FIREBASE IMPORTS ====================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-analytics.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile as firebaseUpdateProfile } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, query, orderBy, Timestamp, getDoc, where, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

    // ==================== FIREBASE CONFIGURATION ====================
    const firebaseConfig = {
        apiKey: "AIzaSyDSZI1Bvsq-KxJJZjmuj5kjyE1xicBbNUI",
        authDomain: "ob-logistique.firebaseapp.com",
        databaseURL: "https://ob-logistique-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "ob-logistique",
        storageBucket: "ob-logistique.firebasestorage.app",
        messagingSenderId: "1019224276320",
        appId: "1:1019224276320:web:770fd80601476cc6337205",
        measurementId: "G-JHE00269BM"
    };

    // ==================== INITIALIZE FIREBASE ====================
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const rtdb = getDatabase(app);

    // ==================== GLOBAL VARIABLES ====================
    let currentUser = null;
    let commissionRate = 8;
    let allOrders = [];
    let allTransporters = [];
    let allPayments = [];
    let activityChart = null;
    let map = null;

    // ==================== TOAST NOTIFICATION SYSTEM ====================
    function showToast(title, message, type = 'success') {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        let iconClass = '';
        if (type === 'success') iconClass = 'fa-check-circle';
        else if (type === 'error') iconClass = 'fa-exclamation-triangle';
        else if (type === 'warning') iconClass = 'fa-exclamation-circle';
        else iconClass = 'fa-info-circle';
        
        toast.innerHTML = `
            <div class="toast-icon ${type}"><i class="fas ${iconClass}"></i></div>
            <div class="toast-content">
                <div class="toast-title">${title}</div>
                <div class="toast-message">${message}</div>
            </div>
            <div class="toast-close"><i class="fas fa-times"></i></div>
        `;
        
        container.appendChild(toast);
        const closeBtn = toast.querySelector('.toast-close');
        closeBtn.addEventListener('click', () => {
            toast.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        });
        setTimeout(() => {
            if (toast.parentNode) {
                toast.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }
        }, 5000);
    }

    // ==================== HELPER FUNCTIONS ====================
    function calculatePrice(weight) { return Math.floor(45 + (weight * 0.11)); }
    function calculateCommission(amount) { return (amount * commissionRate) / 100; }

    function updateStats() {
        const pendingOrders = allOrders.filter(o => o.status === 'pending').length;
        const activeShipments = allOrders.filter(o => o.status === 'accepted' || o.status === 'transit').length;
        const totalCommission = allPayments.reduce((sum, p) => sum + (p.commission || 0), 0);
        
        document.getElementById('statOrders').innerText = pendingOrders;
        document.getElementById('statTransporters').innerText = allTransporters.length;
        document.getElementById('statActiveShipments').innerText = activeShipments;
        document.getElementById('statTotalCommission').innerText = totalCommission.toFixed(2);
        document.getElementById('activeCount').innerText = activeShipments;
        document.getElementById('completedCount').innerText = allOrders.filter(o => o.status === 'delivered').length;
    }

    // ==================== INITIALIZE MAP SAFELY ====================
    function initMap() {
        if (!map) {
            map = L.map('map').setView([34.74, 10.76], 7); // إحداثيات افتراضية لتونس (وصفاقس)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { 
                attribution: '© OpenStreetMap' 
            }).addTo(map);
        }
    }

    // ==================== RENDER FUNCTIONS ====================
    function renderOrders() {
        const containers = ['recentOrders', 'ordersList'];
        containers.forEach(containerId => {
            const container = document.getElementById(containerId);
            if (!container) return;
            if (allOrders.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px;"><i class="fas fa-inbox"></i> لا توجد طلبات</div>';
                return;
            }
            container.innerHTML = allOrders.map(order => `
                <div class="data-item">
                    <div>
                        <strong><i class="fas fa-road"></i> ${order.route}</strong><br>
                        <i class="fas fa-weight-hanging"></i> ${order.weight} كغ | <i class="fas fa-box"></i> ${order.goodsType}<br>
                        <span class="badge badge-${order.status === 'pending' ? 'pending' : order.status === 'accepted' ? 'accepted' : order.status === 'transit' ? 'transit' : 'delivered'}">
                            ${order.status === 'pending' ? '⏳ قيد الانتظار' : order.status === 'accepted' ? '✅ تم القبول' : order.status === 'transit' ? '🚚 قيد النقل' : '📦 تم التوصيل'}
                        </span>
                    </div>
                    <div><i class="fas fa-dollar-sign"></i> ${order.price || calculatePrice(order.weight)} دينار</div>
                    <div>
                        <select class="update-status" data-id="${order.id}" style="background: var(--bg-hover); border: 1px solid var(--border); border-radius: 8px; padding: 6px; color: white;">
                            <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>⏳ قيد الانتظار</option>
                            <option value="accepted" ${order.status === 'accepted' ? 'selected' : ''}>✅ تم القبول</option>
                            <option value="transit" ${order.status === 'transit' ? 'selected' : ''}>🚚 قيد النقل</option>
                            <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>📦 تم التوصيل</option>
                        </select>
                    </div>
                </div>
            `).join('');
        });
        
        document.querySelectorAll('.update-status').forEach(select => {
            select.addEventListener('change', async () => {
                const orderId = select.dataset.id;
                const newStatus = select.value;
                try {
                    await updateDoc(doc(db, 'orders', orderId), { status: newStatus });
                    const statusNames = { pending: 'قيد الانتظار', accepted: 'تم القبول', transit: 'قيد النقل', delivered: 'تم التوصيل' };
                    showToast('✅ تم التحديث', `تم تغيير حالة الطلب إلى ${statusNames[newStatus]}`, 'success');
                    updateStats();
                } catch (error) {
                    showToast('❌ خطأ', 'حدث خطأ أثناء تحديث الحالة', 'error');
                }
            });
        });
    }

    function renderTransporters() {
        const container = document.getElementById('transportersList');
        if (!container) return;
        if (allTransporters.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px;"><i class="fas fa-truck"></i> لا يوجد ناقلين مسجلين</div>';
            return;
        }
        container.innerHTML = allTransporters.map(t => `
            <div class="data-item">
                <div>
                    <strong><i class="fas fa-user"></i> ${t.name}</strong><br>
                    <i class="fas fa-phone"></i> ${t.phone} | <i class="fas fa-truck"></i> ${t.truckType} | <i class="fas fa-map-pin"></i> ${t.region}
                </div>
                <div>
                    <button class="assign-transporter" data-id="${t.id}" data-name="${t.name}" style="background: var(--accent); border: none; padding: 6px 12px; border-radius: 8px; color: var(--bg-primary); cursor: pointer;"><i class="fas fa-check"></i> تعيين لطلب</button>
                    <button class="delete-transporter" data-id="${t.id}" style="background: var(--danger); border: none; padding: 6px 12px; border-radius: 8px; color: white; cursor: pointer; margin-right: 8px;"><i class="fas fa-trash"></i> حذف</button>
                </div>
            </div>
        `).join('');
        
        document.querySelectorAll('.assign-transporter').forEach(btn => {
            btn.addEventListener('click', async () => {
                const pendingOrders = allOrders.filter(o => o.status === 'pending');
                if (pendingOrders.length === 0) {
                    showToast('⚠️ تنبيه', 'لا توجد طلبات معلقة لتعيين ناقل', 'warning');
                    return;
                }
                const order = pendingOrders[0];
                try {
                    await updateDoc(doc(db, 'orders', order.id), { status: 'accepted', transporterId: btn.dataset.id, transporterName: btn.dataset.name, acceptedAt: Timestamp.now() });
                    showToast('✅ تم التعيين', `تم تعيين الناقل ${btn.dataset.name} للطلب ${order.route}`, 'success');
                    updateStats();
                } catch (error) {
                    showToast('❌ خطأ', 'حدث خطأ أثناء تعيين الناقل', 'error');
                }
            });
        });
        
        document.querySelectorAll('.delete-transporter').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (confirm('هل أنت متأكد من حذف هذا الناقل؟')) {
                    try {
                        await deleteDoc(doc(db, 'transporters', btn.dataset.id));
                        showToast('✅ تم الحذف', 'تم حذف الناقل بنجاح', 'success');
                    } catch (error) {
                        showToast('❌ خطأ', 'فشل حذف الناقل', 'error');
                    }
                }
            });
        });
    }

    function renderActiveShipments() {
        const container = document.getElementById('activeShipmentsList');
        const allContainer = document.getElementById('allShipmentsList');
        const activeShipments = allOrders.filter(o => o.status === 'accepted' || o.status === 'transit');
        
        if (container) {
            if (activeShipments.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px;"><i class="fas fa-ship"></i> لا توجد نقلات نشطة</div>';
            } else {
                container.innerHTML = activeShipments.map(order => `
                    <div class="data-item">
                        <div>
                            <strong><i class="fas fa-road"></i> ${order.route}</strong><br>
                            <i class="fas fa-weight-hanging"></i> ${order.weight} كغ | <i class="fas fa-box"></i> ${order.goodsType}<br>
                            <span class="badge badge-${order.status === 'accepted' ? 'accepted' : 'transit'}">${order.status === 'accepted' ? '✅ تم القبول' : '🚚 قيد النقل'}</span>
                        </div>
                        <div><i class="fas fa-truck"></i> ناقل: ${order.transporterName || 'لم يتم تعيين'}</div>
                        <div><button class="track-shipment" data-id="${order.id}" style="background: var(--info); border: none; padding: 6px 12px; border-radius: 8px; color: white; cursor: pointer;"><i class="fas fa-map-marker-alt"></i> تتبع</button></div>
                    </div>
                `).join('');
            }
        }
        
        if (allContainer) {
            if (activeShipments.length === 0) {
                allContainer.innerHTML = '<div style="text-align:center; padding:40px;"><i class="fas fa-ship"></i> لا توجد نقلات نشطة</div>';
            } else {
                allContainer.innerHTML = activeShipments.map(order => `
                    <div class="data-item">
                        <div>
                            <strong><i class="fas fa-road"></i> ${order.route}</strong><br>
                            <i class="fas fa-weight-hanging"></i> ${order.weight} كغ | <i class="fas fa-box"></i> ${order.goodsType}<br>
                            <span class="badge badge-${order.status === 'accepted' ? 'accepted' : 'transit'}">${order.status === 'accepted' ? '✅ تم القبول' : '🚚 قيد النقل'}</span>
                        </div>
                        <div><i class="fas fa-dollar-sign"></i> ${order.price || calculatePrice(order.weight)} دينار</div>
                        <div><button class="track-shipment" data-id="${order.id}" style="background: var(--info); border: none; padding: 6px 12px; border-radius: 8px; color: white; cursor: pointer;"><i class="fas fa-map-marker-alt"></i> تتبع</button></div>
                    </div>
                `).join('');
            }
        }
        
        document.querySelectorAll('.track-shipment').forEach(btn => {
            btn.addEventListener('click', () => {
                const trackingInput = document.getElementById('trackingOrderId');
                if(trackingInput) trackingInput.value = btn.dataset.id;
                window.switchPage('tracking');
                setTimeout(() => {
                    const trackBtn = document.getElementById('trackBtn');
                    if(trackBtn) trackBtn.click();
                }, 500);
                showToast('📍 تتبع', 'جاري تحميل موقع الشحنة على الخريطة', 'info');
            });
        });
    }

    function renderPayments() {
        const container = document.getElementById('paymentsList');
        if (!container) return;
        if (allPayments.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px;"><i class="fas fa-credit-card"></i> لا توجد مدفوعات</div>';
            return;
        }
        container.innerHTML = allPayments.slice(0, 10).map(p => `
            <div class="data-item">
                <div>
                    <strong><i class="fas fa-tag"></i> طلب: ${p.orderId}</strong><br>
                    <i class="fas fa-user"></i> ${p.payerName}<br>
                    <i class="fas fa-calendar"></i> ${p.date ? new Date(p.date.toDate()).toLocaleDateString('ar-TN') : ''}
                </div>
                <div>
                    <div><i class="fas fa-dollar-sign"></i> ${p.amount} دينار</div>
                    <div><i class="fas fa-percent"></i> عمولة: ${p.commission} دينار</div>
                </div>
            </div>
        `).join('');
    }

    function updateChart() {
        if (activityChart) activityChart.destroy();
        const ctx = document.getElementById('activityChart')?.getContext('2d');
        if (ctx) {
            const last7Days = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                last7Days.push(d.toLocaleDateString('ar-TN'));
            }
            const counts = last7Days.map(day => allOrders.filter(o => o.createdAt && new Date(o.createdAt.toDate()).toDateString() === new Date(day).toDateString()).length);
            activityChart = new Chart(ctx, {
                type: 'line',
                data: { labels: last7Days, datasets: [{ label: 'الطلبات', data: counts, borderColor: '#ffb703', backgroundColor: 'rgba(255,183,3,0.1)', tension: 0.3, fill: true }] },
                options: { responsive: true, maintainAspectRatio: true }
            });
        }
    }

    // ==================== CRUD OPERATIONS ====================
    async function publishOrder(e) {
        e.preventDefault();
        const weight = parseFloat(document.getElementById('weight').value);
        const price = document.getElementById('proposedPrice').value || calculatePrice(weight);
        try {
            await addDoc(collection(db, 'orders'), {
                route: document.getElementById('route').value,
                weight: weight,
                goodsType: document.getElementById('goodsType').value,
                timeSlot: document.getElementById('timeSlot').value,
                phone: document.getElementById('phone').value,
                notes: document.getElementById('notes').value,
                price: parseFloat(price),
                status: 'pending',
                createdAt: Timestamp.now(),
                userId: currentUser?.uid
            });
            showToast('✅ تم النشر', 'تم نشر طلب النقل بنجاح! سيشاهده الناقلون قريباً', 'success');
            closeModal('newOrderModal');
            document.getElementById('orderForm').reset();
            if (window.flatpickrInstance) window.flatpickrInstance.clear();
        } catch (error) {
            showToast('❌ خطأ', 'حدث خطأ أثناء نشر الطلب. تأكد من اتصال الإنترنت', 'error');
        }
    }

    async function addTransporter(e) {
        e.preventDefault();
        try {
            await addDoc(collection(db, 'transporters'), {
                name: document.getElementById('transporterName').value,
                phone: document.getElementById('transporterPhone').value,
                email: document.getElementById('transporterEmail').value || '',
                truckType: document.getElementById('truckType').value,
                region: document.getElementById('transporterRegion').value,
                cin: document.getElementById('transporterCin').value || '',
                available: true,
                rating: 0,
                createdAt: Timestamp.now()
            });
            showToast('✅ تم التسجيل', `تم تسجيل الناقل ${document.getElementById('transporterName').value} بنجاح`, 'success');
            closeModal('newTransporterModal');
            document.getElementById('transporterForm').reset();
        } catch (error) {
            showToast('❌ خطأ', 'حدث خطأ أثناء تسجيل الناقل', 'error');
        }
    }

    async function processPayment(e) {
        e.preventDefault();
        const amount = parseFloat(document.getElementById('paymentAmount').value);
        const commission = calculateCommission(amount);
        try {
            await addDoc(collection(db, 'payments'), {
                orderId: document.getElementById('paymentOrderId').value,
                amount: amount,
                commission: commission,
                payerName: document.getElementById('payerName').value,
                payerCin: document.getElementById('payerCin').value,
                postOffice: document.getElementById('postOffice').value,
                date: Timestamp.now(),
                userId: currentUser?.uid
            });
            showToast('💰 تم الدفع', `تم تأكيد الدفع بمبلغ ${amount} دينار | عمولة المنصة: ${commission.toFixed(2)} دينار`, 'success');
            document.getElementById('paymentForm').reset();
            window.updateCommissionDisplay();
            const qrDiv = document.getElementById('qrcode');
            if (qrDiv) {
                qrDiv.innerHTML = '';
                new QRCode(qrDiv, { text: `OB Logistique - ${amount} TND - Commission: ${commission.toFixed(2)} TND`, width: 150, height: 150 });
            }
        } catch (error) {
            showToast('❌ خطأ', 'حدث خطأ أثناء تأكيد الدفع', 'error');
        }
    }

    async function trackOrder(e) {
        if(e) e.preventDefault();
        const orderId = document.getElementById('trackingOrderId').value;
        if (!orderId) { showToast('⚠️ تنبيه', 'الرجاء إدخال رقم الطلب', 'warning'); return; }
        try {
            const orderDoc = await getDoc(doc(db, 'orders', orderId));
            if (!orderDoc.exists()) { showToast('❌ خطأ', 'الطلب غير موجود', 'error'); return; }
            const order = orderDoc.data();
            
            initMap(); // التأكد من أن الخريطة جاهزة
            
            const lat = 34.74 + (Math.random() - 0.5) * 0.3; // محاكاة موقع حول صفاقس/تونس
            const lng = 10.76 + (Math.random() - 0.5) * 0.3;
            
            if (window.currentMarker) map.removeLayer(window.currentMarker);
            window.currentMarker = L.marker([lat, lng]).addTo(map).bindPopup(`
                <strong>الطلب: ${order.route}</strong><br>
                الوزن: ${order.weight} كغ<br>
                الحالة: ${order.status === 'pending' ? '⏳ قيد الانتظار' : order.status === 'accepted' ? '✅ تم القبول' : order.status === 'transit' ? '🚚 قيد النقل' : '📦 تم التوصيل'}<br>
                السعر: ${order.price} دينار
            `).openPopup();
            map.setView([lat, lng], 10);
            
            const trackingDetails = document.getElementById('trackingDetails');
            if (trackingDetails) {
                trackingDetails.style.display = 'block';
                trackingDetails.innerHTML = `
                    <div class="data-item">
                        <div>
                            <strong><i class="fas fa-tag"></i> رقم الطلب:</strong> ${orderId}<br>
                            <strong><i class="fas fa-road"></i> المسار:</strong> ${order.route}<br>
                            <strong><i class="fas fa-weight-hanging"></i> الوزن:</strong> ${order.weight} كغ<br>
                            <strong><i class="fas fa-dollar-sign"></i> السعر:</strong> ${order.price} دينار<br>
                            <strong><i class="fas fa-info-circle"></i> الحالة:</strong> <span class="badge badge-${order.status}">${order.status === 'pending' ? '⏳ قيد الانتظار' : order.status === 'accepted' ? '✅ تم القبول' : order.status === 'transit' ? '🚚 قيد النقل' : '📦 تم التوصيل'}</span>
                        </div>
                    </div>
                `;
            }
            showToast('📍 موقع الشحنة', 'تم العثور على موقع الشحنة على الخريطة', 'success');
        } catch (error) {
            showToast('❌ خطأ', 'حدث خطأ أثناء تتبع الطلب', 'error');
        }
    }

    async function updateCommissionRate() {
        const newRate = parseFloat(document.getElementById('adminCommissionRate').value);
        if (!isNaN(newRate) && newRate >= 0 && newRate <= 100) {
            commissionRate = newRate;
            try {
                await set(ref(rtdb, 'settings/commissionRate'), newRate);
                document.getElementById('commissionRate').innerText = newRate;
                showToast('⚙️ تم التحديث', `تم تغيير نسبة العمولة إلى ${newRate}%`, 'success');
            } catch (error) {
                showToast('❌ خطأ', 'فشل تحديث النسبة في قاعدة البيانات', 'error');
            }
        } else {
            showToast('⚠️ خطأ', 'الرجاء إدخال نسبة صحيحة بين 0 و 100', 'warning');
        }
    }

    async function handleUpdateProfile() {
        const newName = document.getElementById('settingsName').value;
        if (newName && currentUser) {
            try {
                await firebaseUpdateProfile(currentUser, { displayName: newName });
                document.getElementById('userName').innerHTML = newName;
                document.getElementById('userAvatar').innerHTML = newName.substring(0,2).toUpperCase();
                showToast('✅ تم التحديث', 'تم تحديث الملف الشخصي بنجاح', 'success');
            } catch (error) {
                showToast('❌ خطأ', 'حدث خطأ أثناء تحديث الملف الشخصي', 'error');
            }
        }
    }

    window.updateCommissionDisplay = function() {
        const amount = parseFloat(document.getElementById('paymentAmount')?.value) || 0;
        const commission = calculateCommission(amount);
        const details = document.getElementById('commissionDetails');
        if (details) details.innerHTML = `<i class="fas fa-dollar-sign"></i> المبلغ: ${amount} دينار | <i class="fas fa-percent"></i> عمولة (${commissionRate}%): ${commission.toFixed(2)} دينار | <i class="fas fa-truck"></i> صافي الناقل: ${(amount - commission).toFixed(2)} دينار`;
    }

    // ==================== FIREBASE LISTENERS ====================
    function subscribeToFirestore() {
        onSnapshot(query(collection(db, 'orders'), orderBy('createdAt', 'desc')), (snapshot) => {
            allOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderOrders();
            renderActiveShipments();
            updateStats();
            updateChart();
        });
        onSnapshot(collection(db, 'transporters'), (snapshot) => {
            allTransporters = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderTransporters();
            updateStats();
        });
        onSnapshot(collection(db, 'payments'), (snapshot) => {
            allPayments = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderPayments();
            updateStats();
        });
        
        const commissionRef = ref(rtdb, 'settings/commissionRate');
        onValue(commissionRef, (snapshot) => {
            const val = snapshot.val();
            if (val !== null) { 
                commissionRate = val; 
                document.getElementById('commissionRate').innerText = commissionRate; 
                document.getElementById('adminCommissionRate').value = commissionRate; 
                window.updateCommissionDisplay();
            }
        });
    }

    // ==================== NAVIGATION ====================
    window.switchPage = function(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const activePage = document.getElementById(`${pageId}Page`);
        if(activePage) activePage.classList.add('active');
        
        document.querySelectorAll('.nav-item-modern').forEach(nav => nav.classList.remove('active'));
        const activeNav = document.querySelector(`[data-page="${pageId}"]`);
        if(activeNav) activeNav.classList.add('active');
        
        if (pageId === 'tracking') {
            setTimeout(initMap, 200); // إعطاء الواجهة مهلة قصيرة للظهور قبل حساب أبعاد الخريطة
        }
    };

    function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
    window.closeModal = closeModal;

    // ==================== AUTHENTICATION ====================
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            const displayName = user.displayName || user.email;
            document.getElementById('userName').innerHTML = displayName;
            document.getElementById('userAvatar').innerHTML = displayName.substring(0,2).toUpperCase();
            document.getElementById('settingsName').value = user.displayName || '';
            document.getElementById('settingsEmail').value = user.email;
            subscribeToFirestore();
            showToast('👋 مرحباً', `تم تسجيل الدخول بنجاح! مرحباً بك`, 'success');
        } else {
            signInWithEmailAndPassword(auth, 'merchant@oblogistique.com', 'merchant123').then(() => {
                showToast('🔐 تسجيل دخول تلقائي', 'تم تسجيل الدخول إلى الحساب التجريبي بنجاح', 'info');
            }).catch(() => {
                showToast('⚠️ تنبيه', 'الرجاء تسجيل الدخول يدوياً', 'warning');
            });
        }
    });

    // ==================== EVENT LISTENERS ====================
    document.getElementById('orderForm')?.addEventListener('submit', publishOrder);
    document.getElementById('transporterForm')?.addEventListener('submit', addTransporter);
    document.getElementById('paymentForm')?.addEventListener('submit', processPayment);
    document.getElementById('trackBtn')?.addEventListener('click', trackOrder);
    document.getElementById('updateCommissionBtn')?.addEventListener('click', updateCommissionRate);
    document.getElementById('updateProfileBtn')?.addEventListener('click', handleUpdateProfile);
    document.getElementById('paymentAmount')?.addEventListener('input', window.updateCommissionDisplay);
    document.getElementById('logoutBtn')?.addEventListener('click', () => signOut(auth));
    document.getElementById('toggleSidebar')?.addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('collapsed'); });
    document.getElementById('showNewOrderModal')?.addEventListener('click', () => { document.getElementById('newOrderModal').style.display = 'flex'; });
    document.getElementById('showNewTransporterModal')?.addEventListener('click', () => { document.getElementById('newTransporterModal').style.display = 'flex'; });
    
    document.querySelectorAll('.nav-item-modern').forEach(nav => {
        if (nav.dataset.page) nav.addEventListener('click', () => window.switchPage(nav.dataset.page));
    });

    // ==================== INITIALIZATION ====================
    const timeInput = document.getElementById('timeSlot');
    if (timeInput) window.flatpickrInstance = flatpickr(timeInput, { locale: 'ar', enableTime: true, dateFormat: "Y-m-d H:i", time_24hr: true, minDate: "today" });
    
    const qrDiv = document.getElementById('qrcode');
    if (qrDiv) new QRCode(qrDiv, { text: "OB Logistique - منصة النقل الذكية", width: 150, height: 150 });
    
    window.updateCommissionDisplay();
    
    console.log('✅ تم تحميل التطبيق بنجاح - النسخة النهائية والمحسنة');
    showToast('🚀 تم التحميل', 'تم تحميل التطبيق بنجاح! جميع الوظائف تعمل ومستقرة', 'success');
</script>
